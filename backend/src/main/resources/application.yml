spring:
  application:
    name: flashopify
  profiles:
    default: local
  # Both Flyway instances are defined in common.config.FlywayConfig.
  flyway:
    enabled: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

# MySQL = primary store (MyBatis); PostgreSQL + pgvector = ai module only.
app:
  datasource:
    mysql:
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        pool-name: mysql-pool
    ai:
      driver-class-name: org.postgresql.Driver
      hikari:
        pool-name: ai-pool

  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: flashopify
      access-ttl: 15m
      refresh-ttl: 7d
    login:
      max-failed-attempts: 5
      lock-duration: 15m

  catalog:
    cache:
      detail-ttl: 10m

  # Stock is loaded into Redis this long before startTime; campaigns are read-only from then on.
  flash-sale:
    warm-up-lead: 5m
    key-retention: 1d
    scheduler-batch-size: 50
    scheduler:
      enabled: true
      interval-ms: 5000

  # Idempotency-Key (FLS-018): finished responses are replayed for ttl; an unfinished claim
  # blocks the key for at most processing-ttl.
  idempotency:
    ttl: 24h
    processing-ttl: 60s

  # Token buckets per policy (FLS-019, SEC-06): capacity = burst, refill-period = time to earn
  # one token back. user buckets apply to authenticated calls only. Tune without code changes.
  rate-limit:
    enabled: true
    policies:
      login:
        ip: { capacity: 10, refill-period: 6s }        # 10/min per IP
      flash-sale-purchase:
        user: { capacity: 5, refill-period: 1s }       # burst 5, then 1/s per user
        ip: { capacity: 100, refill-period: 50ms }     # 20/s per IP (NAT, offices)
      ai-chat:
        user: { capacity: 10, refill-period: 6s }      # 10/min per user
        ip: { capacity: 30, refill-period: 2s }        # 30/min per IP (guests included)

  # MinIO vs S3 is configuration only: set endpoint (+ path-style) for MinIO, leave blank for S3.
  storage:
    bucket: ${STORAGE_BUCKET:}
    region: ${STORAGE_REGION:us-east-1}
    endpoint: ${STORAGE_ENDPOINT:}
    presign-endpoint: ${STORAGE_PRESIGN_ENDPOINT:}
    path-style-access: ${STORAGE_PATH_STYLE:false}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:}
    presign-ttl: 10m

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-statement-timeout: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"
