# Seed job (FLS-011): `bash scripts/seed/seed.sh` runs with profiles local,seed. No web server.
spring:
  main:
    web-application-type: none

app:
  seed:
    auto-run: true
    products:
      enabled: true
    dummyjson:
      base-url: https://dummyjson.com
      page-size: 100
    image:
      max-retries: 3
      backoff: 200ms
      max-bytes: 5242880
      timeout: 10s
