# Profile for automated tests. Connection URLs are supplied by Testcontainers via
# @DynamicPropertySource. Redis/Kafka clients connect lazily, so tests that do not use them need
# no broker; the Redis health check is off for the same reason.
app:
  # Tests drive CampaignLifecycleService directly.
  flash-sale:
    scheduler:
      enabled: false
  # Every test shares 127.0.0.1 and one Redis: keep login effectively unlimited; the probe
  # policies exercise the limiter itself (RateLimitIT).
  rate-limit:
    policies:
      login:
        ip: { capacity: 1000, refill-period: 60s }
      test-probe:
        user: { capacity: 3, refill-period: 1h }
        ip: { capacity: 5, refill-period: 1h }
      test-refill:
        ip: { capacity: 2, refill-period: 300ms }

  storage:
    bucket: test-bucket
    region: us-east-1
    endpoint: http://localhost:9
    path-style-access: true
    access-key: test
    secret-key: test
    public-base-url: http://localhost:9/test-bucket
  security:
    jwt:
      secret: test-only-secret-key-for-automated-tests-0123456789

management:
  health:
    redis:
      enabled: false
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.flywaydb: info
