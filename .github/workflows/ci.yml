name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Unit tests + Testcontainers integration tests (Docker is available on ubuntu runners).
      - name: Build and test
        run: ./mvnw -B verify
      - name: Style (spotless + checkstyle)
        run: ./mvnw -B spotless:check checkstyle:check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: API types are up to date with docs/api/openapi.yaml
        run: |
          npm run gen:api
          git diff --exit-code -- src/shared/api/schema.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
