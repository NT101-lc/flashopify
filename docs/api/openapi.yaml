openapi: 3.1.0
info:
  title: Flashopify API
  version: 1.0.0
  summary: E-commerce platform with flash-sale support.
  description: |
    REST API for the Flashopify storefront, admin and payment gateway integration.

    Conventions (see docs/srs.md §6.4 and docs/conventions.md):
    - JSON fields are camelCase; money is a decimal **string** with 2 fraction digits (e.g. `"129.99"`);
      timestamps are ISO-8601 in UTC (e.g. `"2026-11-27T12:00:00Z"`).
    - Every response carries an `X-Trace-Id` header; errors repeat it in `traceId`.
    - Errors use `ErrorResponse` with a business `code` from `ErrorCode`.
    - Paginated lists accept `page` (0-based), `size`, `sort` and return `PageResponse`.
    - `Idempotency-Key` is required on `POST /orders` and `POST /flash-sales/{itemId}/purchase`.
      Replaying a key returns the original result; reusing a key with a different body returns
      409 `IDEMPOTENCY_KEY_CONFLICT`.

    Access control is declared per operation with the `x-roles` extension:
    - `PUBLIC` – no token needed (a token, if sent, may personalise the response)
    - `CUSTOMER` – role CUSTOMER
    - `ADMIN` – role ADMIN
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: /api/v1
    description: Relative to the host serving the API (http://localhost:8080 when running locally).
security:
  - bearerAuth: []
tags:
  - name: auth
    description: Registration, login, tokens, profile and shipping addresses.
  - name: products
    description: Public product catalog.
  - name: categories
    description: Public category tree.
  - name: cart
    description: Server-side shopping cart of the current customer.
  - name: orders
    description: Normal orders of the current customer.
  - name: flash-sales
    description: Public flash-sale listing and flash-sale purchase.
  - name: payments
    description: Mock payment sessions and the gateway webhook.
  - name: ai
    description: AI shopping assistant (RAG + tool calling).
  - name: admin-products
    description: Product, inventory and image management.
  - name: admin-flash-sales
    description: Flash-sale campaign management.
  - name: admin-orders
    description: Order management across all customers.
  - name: admin-customers
    description: Customer lookup for the admin UI.
  - name: admin-stats
    description: Dashboard KPIs and reports.

paths:
  # ===================== AUTH =====================
  /auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Register a customer account
      x-roles: [PUBLIC]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: an.nguyen@example.com
              password: S3cure!pass
              fullName: Nguyen Van An
              phone: '0901234567'
      responses:
        '201':
          description: Account created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
              example:
                id: 1024
                email: an.nguyen@example.com
                fullName: Nguyen Van An
                phone: '0901234567'
                role: CUSTOMER
                createdAt: '2026-10-27T08:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email already registered (`EMAIL_ALREADY_EXISTS`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: EMAIL_ALREADY_EXISTS
                message: Email đã được sử dụng
                traceId: a1b2c3d4
                timestamp: '2026-10-27T08:00:00Z'

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Log in with email and password
      description: Rate-limited per IP and email. 5 consecutive failures lock the account for 15 minutes.
      x-roles: [PUBLIC]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: an.nguyen@example.com
              password: S3cure!pass
      responses:
        '200':
          description: Tokens issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              example:
                accessToken: eyJhbGciOiJIUzI1NiJ9.access
                refreshToken: eyJhbGciOiJIUzI1NiJ9.refresh
                tokenType: Bearer
                expiresIn: 900
                user:
                  id: 1024
                  email: an.nguyen@example.com
                  fullName: Nguyen Van An
                  phone: '0901234567'
                  role: CUSTOMER
                  createdAt: '2026-10-27T08:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Wrong email or password (`INVALID_CREDENTIALS`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: INVALID_CREDENTIALS
                message: Email hoặc mật khẩu không đúng
                traceId: a1b2c3d4
                timestamp: '2026-10-27T08:00:00Z'
        '423':
          description: Account locked after too many failures (`ACCOUNT_LOCKED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: ACCOUNT_LOCKED
                message: Tài khoản bị khoá đến 08:15 UTC
                traceId: a1b2c3d4
                timestamp: '2026-10-27T08:00:00Z'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshToken
      summary: Exchange a refresh token for a new token pair
      description: Refresh tokens are single-use (rotated) and stored in Redis.
      x-roles: [PUBLIC]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
            example:
              refreshToken: eyJhbGciOiJIUzI1NiJ9.refresh
      responses:
        '200':
          description: New token pair.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              example:
                accessToken: eyJhbGciOiJIUzI1NiJ9.access2
                refreshToken: eyJhbGciOiJIUzI1NiJ9.refresh2
                tokenType: Bearer
                expiresIn: 900
                user:
                  id: 1024
                  email: an.nguyen@example.com
                  fullName: Nguyen Van An
                  phone: '0901234567'
                  role: CUSTOMER
                  createdAt: '2026-10-27T08:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the given refresh token
      x-roles: [CUSTOMER, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
            example:
              refreshToken: eyJhbGciOiJIUzI1NiJ9.refresh
      responses:
        '204':
          description: Logged out.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /me:
    get:
      tags: [auth]
      operationId: getMyProfile
      summary: Get the current user's profile
      x-roles: [CUSTOMER, ADMIN]
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
              example:
                id: 1024
                email: an.nguyen@example.com
                fullName: Nguyen Van An
                phone: '0901234567'
                role: CUSTOMER
                createdAt: '2026-10-27T08:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [auth]
      operationId: updateMyProfile
      summary: Update the current user's profile
      x-roles: [CUSTOMER, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
            example:
              fullName: Nguyen Van An
              phone: '0909999999'
      responses:
        '200':
          description: Updated profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
              example:
                id: 1024
                email: an.nguyen@example.com
                fullName: Nguyen Van An
                phone: '0909999999'
                role: CUSTOMER
                createdAt: '2026-10-27T08:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [auth]
      operationId: deleteMyAccount
      summary: Delete the current account
      description: Soft-deletes the user (status DELETED), anonymises personal data and revokes all tokens. Orders and payments are retained (SRS OR-13).
      x-roles: [CUSTOMER]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccountRequest'
            example:
              password: S3cure!pass
      responses:
        '204':
          description: Account deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /me/password:
    put:
      tags: [auth]
      operationId: changeMyPassword
      summary: Change password
      description: Revokes every refresh token of the user.
      x-roles: [CUSTOMER, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            example:
              currentPassword: S3cure!pass
              newPassword: N3w!passw0rd
      responses:
        '204':
          description: Password changed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /me/addresses:
    get:
      tags: [auth]
      operationId: listMyAddresses
      summary: List shipping addresses
      x-roles: [CUSTOMER]
      responses:
        '200':
          description: Addresses, default first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Address'
              example:
                - id: 12
                  receiverName: Nguyen Van An
                  phone: '0901234567'
                  addressLine: 12 Nguyen Hue
                  ward: Ben Nghe
                  district: Quan 1
                  city: Ho Chi Minh
                  isDefault: true
                  createdAt: '2026-10-27T08:05:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [auth]
      operationId: createMyAddress
      summary: Add a shipping address
      x-roles: [CUSTOMER]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressRequest'
            example:
              receiverName: Nguyen Van An
              phone: '0901234567'
              addressLine: 12 Nguyen Hue
              ward: Ben Nghe
              district: Quan 1
              city: Ho Chi Minh
              isDefault: true
      responses:
        '201':
          description: Address created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
              example:
                id: 12
                receiverName: Nguyen Van An
                phone: '0901234567'
                addressLine: 12 Nguyen Hue
                ward: Ben Nghe
                district: Quan 1
                city: Ho Chi Minh
                isDefault: true
                createdAt: '2026-10-27T08:05:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /me/addresses/{addressId}:
    parameters:
      - $ref: '#/components/parameters/AddressId'
    put:
      tags: [auth]
      operationId: updateMyAddress
      summary: Update a shipping address
      x-roles: [CUSTOMER]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressRequest'
            example:
              receiverName: Nguyen Van An
              phone: '0901234567'
              addressLine: 45 Le Loi
              ward: Ben Thanh
              district: Quan 1
              city: Ho Chi Minh
              isDefault: true
      responses:
        '200':
          description: Updated address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
              example:
                id: 12
                receiverName: Nguyen Van An
                phone: '0901234567'
                addressLine: 45 Le Loi
                ward: Ben Thanh
                district: Quan 1
                city: Ho Chi Minh
                isDefault: true
                createdAt: '2026-10-27T08:05:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [auth]
      operationId: deleteMyAddress
      summary: Delete a shipping address
      x-roles: [CUSTOMER]
      responses:
        '204':
          description: Address deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ===================== CATALOG =====================
  /products:
    get:
      tags: [products]
      operationId: listProducts
      summary: Search and filter active products
      x-roles: [PUBLIC]
      security: []
      parameters:
        - name: q
          in: query
          description: Full-text search on name, brand and description.
          schema:
            type: string
            maxLength: 100
          example: phone
        - name: categorySlug
          in: query
          schema:
            type: string
          example: smartphones
        - name: brand
          in: query
          description: Repeatable; matches any of the given brands.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          example: [Apple, Samsung]
        - name: minPrice
          in: query
          schema:
            $ref: '#/components/schemas/Money'
          example: '100.00'
        - name: maxPrice
          in: query
          schema:
            $ref: '#/components/schemas/Money'
          example: '1500.00'
        - name: minRating
          in: query
          schema:
            type: number
            minimum: 0
            maximum: 5
          example: 4
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/ProductSort'
      responses:
        '200':
          description: Page of products.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
              example:
                items:
                  - id: 101
                    name: iPhone 9
                    slug: iphone-9
                    brand: Apple
                    price: '549.00'
                    rating: 4.69
                    thumbnailUrl: https://cdn.flashopify.local/products/101/thumbnail.webp
                    categorySlug: smartphones
                    inStock: true
                    flashSale:
                      itemId: 501
                      salePrice: '399.00'
                      endTime: '2026-11-27T13:00:00Z'
                page: 0
                size: 20
                totalItems: 1
                totalPages: 1
        '400':
          $ref: '#/components/responses/BadRequest'

  /products/brands:
    get:
      tags: [products]
      operationId: listBrands
      summary: List brands for the filter sidebar
      x-roles: [PUBLIC]
      security: []
      parameters:
        - name: categorySlug
          in: query
          schema:
            type: string
          example: smartphones
      responses:
        '200':
          description: Distinct brand names, alphabetical.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              example: [Apple, Huawei, Samsung]
        '400':
          $ref: '#/components/responses/BadRequest'

  /products/{slug}:
    get:
      tags: [products]
      operationId: getProduct
      summary: Get product detail by slug
      description: Cached in Redis. Returns 404 for INACTIVE or DELETED products.
      x-roles: [PUBLIC]
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
          example: iphone-9
      responses:
        '200':
          description: Product detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
              example:
                id: 101
                name: iPhone 9
                slug: iphone-9
                brand: Apple
                price: '549.00'
                rating: 4.69
                thumbnailUrl: https://cdn.flashopify.local/products/101/thumbnail.webp
                categorySlug: smartphones
                inStock: true
                flashSale:
                  itemId: 501
                  salePrice: '399.00'
                  endTime: '2026-11-27T13:00:00Z'
                sku: SKU-APL-0101
                description: An apple mobile which is nothing like apple.
                category:
                  id: 3
                  slug: smartphones
                  name: Smartphones
                availableQuantity: 94
                images:
                  - id: 9001
                    url: https://cdn.flashopify.local/products/101/1.webp
                    sortOrder: 0
                  - id: 9002
                    url: https://cdn.flashopify.local/products/101/2.webp
                    sortOrder: 1
        '404':
          $ref: '#/components/responses/NotFound'

  /categories:
    get:
      tags: [categories]
      operationId: listCategories
      summary: Get the category tree
      x-roles: [PUBLIC]
      security: []
      responses:
        '200':
          description: Root categories with nested children.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
              example:
                - id: 1
                  slug: electronics
                  name: Electronics
                  productCount: 25
                  children:
                    - id: 3
                      slug: smartphones
                      name: Smartphones
                      productCount: 16
                      children: []
        '429':
          $ref: '#/components/responses/TooManyRequests'

  # ===================== CART =====================
  /cart:
    get:
      tags: [cart]
      operationId: getCart
      summary: Get the current cart
      x-roles: [CUSTOMER]
      responses:
        '200':
          description: Cart (empty cart if none exists yet).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
              example:
                items:
                  - productId: 101
                    name: iPhone 9
                    slug: iphone-9
                    thumbnailUrl: https://cdn.flashopify.local/products/101/thumbnail.webp
                    unitPrice: '549.00'
                    quantity: 2
                    lineTotal: '1098.00'
                    availableQuantity: 94
                    addedAt: '2026-10-27T09:00:00Z'
                totalQuantity: 2
                subtotal: '1098.00'
                updatedAt: '2026-10-27T09:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [cart]
      operationId: clearCart
      summary: Remove all items from the cart
      x-roles: [CUSTOMER]
      responses:
        '204':
          description: Cart cleared.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /cart/items:
    post:
      tags: [cart]
      operationId: addCartItem
      summary: Add a product to the cart
      description: If the product is already in the cart the quantity is increased.
      x-roles: [CUSTOMER]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCartItemRequest'
            example:
              productId: 101
              quantity: 1
      responses:
        '200':
          description: Updated cart.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
              example:
                items:
                  - productId: 101
                    name: iPhone 9
                    slug: iphone-9
                    thumbnailUrl: https://cdn.flashopify.local/products/101/thumbnail.webp
                    unitPrice: '549.00'
                    quantity: 1
                    lineTotal: '549.00'
                    availableQuantity: 94
                    addedAt: '2026-10-27T09:00:00Z'
                totalQuantity: 1
                subtotal: '549.00'
                updatedAt: '2026-10-27T09:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InsufficientStock'

  /cart/items/{productId}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    patch:
      tags: [cart]
      operationId: updateCartItem
      summary: Set the quantity of a cart item
      x-roles: [CUSTOMER]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCartItemRequest'
            example:
              quantity: 3
      responses:
        '200':
          description: Updated cart.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
              example:
                items:
                  - productId: 101
                    name: iPhone 9
                    slug: iphone-9
                    thumbnailUrl: https://cdn.flashopify.local/products/101/thumbnail.webp
                    unitPrice: '549.00'
                    quantity: 3
                    lineTotal: '1647.00'
                    availableQuantity: 94
                    addedAt: '2026-10-27T09:00:00Z'
                totalQuantity: 3
                subtotal: '1647.00'
                updatedAt: '2026-10-27T09:10:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InsufficientStock'
    delete:
      tags: [cart]
      operationId: removeCartItem
      summary: Remove a product from the cart
      x-roles: [CUSTOMER]
      responses:
        '204':
          description: Item removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ===================== ORDERS =====================
  /orders:
    post:
      tags: [orders]
      operationId: createOrder
      summary: Place a normal order
      description: |
        Creates a PENDING order, reserves inventory (optimistic lock) and removes the ordered
        products from the cart. The order expires after 15 minutes if unpaid.
      x-roles: [CUSTOMER]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            example:
              addressId: 12
              items:
                - productId: 101
                  quantity: 2
              note: Giao giờ hành chính
      responses:
        '201':
          description: Order created (or the original result when the Idempotency-Key is replayed).
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
              example:
                orderNo: OD20261027000045
                type: NORMAL
                status: PENDING
                totalAmount: '1098.00'
                itemCount: 2
                thumbnailUrl: https://cdn.flashopify.local/products/101/thumbnail.webp
                createdAt: '2026-10-27T09:15:00Z'
                expiredAt: '2026-10-27T09:30:00Z'
                paidAt: null
                items:
                  - productId: 101
                    productName: iPhone 9
                    thumbnailUrl: https://cdn.flashopify.local/products/101/thumbnail.webp
                    quantity: 2
                    unitPrice: '549.00'
                    lineTotal: '1098.00'
                shipping:
                  name: Nguyen Van An
                  phone: '0901234567'
                  address: 12 Nguyen Hue, Ben Nghe, Quan 1, Ho Chi Minh
                flashSaleItemId: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Not enough stock (`INSUFFICIENT_STOCK`), or `IDEMPOTENCY_KEY_CONFLICT` / `REQUEST_IN_PROGRESS`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: INSUFFICIENT_STOCK
                message: Sản phẩm iPhone 9 chỉ còn 1
                traceId: a1b2c3d4
