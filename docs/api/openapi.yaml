          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            Version mismatch (`CONCURRENT_MODIFICATION`), quantity below reserved
            (`INSUFFICIENT_STOCK`) or the product is DELETED (`PRODUCT_NOT_AVAILABLE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: CONCURRENT_MODIFICATION
                message: Tồn kho đã bị thay đổi, vui lòng tải lại
                traceId: a1b2c3d4
                timestamp: '2026-10-27T10:05:00Z'

  /admin/products/{productId}/images/upload-url:
    post:
      tags: [admin-products]
      operationId: adminCreateProductImageUploadUrl
      summary: Get a presigned URL to upload a product image
      description: |
        Step 1 of 2. The client PUTs the file to `uploadUrl` (with the returned headers) directly to
        MinIO/S3, then calls `POST /admin/products/{productId}/images` with `objectKey`.
        JPG/PNG/WebP only, max 5 MB, max 8 gallery images per product.
      x-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageUploadUrlRequest'
            example:
              fileName: front.webp
              contentType: image/webp
              contentLength: 482133
      responses:
        '200':
          description: Presigned upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageUploadUrlResponse'
              example:
                uploadUrl: http://localhost:9000/flashopify/products/101/tmp/0b6e7c.webp?X-Amz-Signature=abc
                objectKey: products/101/tmp/0b6e7c.webp
                method: PUT
                headers:
                  Content-Type: image/webp
                expiresAt: '2026-10-27T10:15:00Z'
        '400':
          description: Validation error, `UNSUPPORTED_MEDIA_TYPE` or `FILE_TOO_LARGE`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: FILE_TOO_LARGE
                message: Ảnh tối đa 5 MB
                traceId: a1b2c3d4
                timestamp: '2026-10-27T10:10:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ImageLimitExceeded'

  /admin/products/{productId}/images:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    post:
      tags: [admin-products]
      operationId: adminAddProductImage
      summary: Register an uploaded image on the product
      description: Step 2 of 2. Verifies the object exists in storage, then stores its CDN URL.
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddProductImageRequest'
            example:
              objectKey: products/101/tmp/0b6e7c.webp
              sortOrder: 2
              setAsThumbnail: false
      responses:
        '201':
          description: Image saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductImage'
              example:
                id: 9003
                url: https://cdn.flashopify.local/products/101/0b6e7c.webp
                sortOrder: 2
        '400':
          description: Validation error or object not found in storage (`OBJECT_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: OBJECT_NOT_FOUND
                message: Chưa tìm thấy file đã upload
                traceId: a1b2c3d4
                timestamp: '2026-10-27T10:12:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ImageLimitExceeded'
    put:
      tags: [admin-products]
      operationId: adminReorderProductImages
      summary: Reorder product images
      description: '`imageIds` must contain every image of the product exactly once; the index becomes `sortOrder`.'
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderImagesRequest'
            example:
              imageIds: [9003, 9001, 9002]
      responses:
        '200':
          description: Images in their new order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductImage'
              example:
                - id: 9003
                  url: https://cdn.flashopify.local/products/101/0b6e7c.webp
                  sortOrder: 0
                - id: 9001
                  url: https://cdn.flashopify.local/products/101/1.webp
                  sortOrder: 1
                - id: 9002
                  url: https://cdn.flashopify.local/products/101/2.webp
                  sortOrder: 2
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/products/{productId}/images/{imageId}:
    delete:
      tags: [admin-products]
      operationId: adminDeleteProductImage
      summary: Delete a product image
      x-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - name: imageId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 9002
      responses:
        '204':
          description: Image deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ===================== ADMIN: FLASH SALES =====================
  /admin/flash-sales:
    get:
      tags: [admin-flash-sales]
      operationId: adminListFlashSales
      summary: List flash-sale campaigns
      x-roles: [ADMIN]
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/FlashSaleCampaignStatus'
          example: SCHEDULED
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/CampaignSort'
      responses:
        '200':
          description: Page of campaigns (without items).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCampaignPage'
              example:
                items:
                  - id: 7
                    name: Black Friday 12h
                    startTime: '2026-11-27T12:00:00Z'
                    endTime: '2026-11-27T13:00:00Z'
                    status: SCHEDULED
                    itemCount: 1
                    totalStock: 100
                    createdBy: 1
                    createdAt: '2026-10-27T10:00:00Z'
                page: 0
                size: 20
                totalItems: 1
                totalPages: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [admin-flash-sales]
      operationId: adminCreateFlashSale
      summary: Create a flash-sale campaign
      description: |
        Validates start time in the future, end after start, and `totalStock` ≤ available inventory
        per product; reserves that stock. Status starts as SCHEDULED; stock is warmed up into Redis
        5 minutes before `startTime`.
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignUpsertRequest'
            example:
              name: Black Friday 12h
              startTime: '2026-11-27T12:00:00Z'
              endTime: '2026-11-27T13:00:00Z'
              items:
                - productId: 101
                  salePrice: '399.00'
                  totalStock: 100
                  limitPerUser: 1
      responses:
        '201':
          description: Campaign created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCampaignDetail'
              example:
                id: 7
                name: Black Friday 12h
                startTime: '2026-11-27T12:00:00Z'
                endTime: '2026-11-27T13:00:00Z'
                status: SCHEDULED
                itemCount: 1
                totalStock: 100
                createdBy: 1
                createdAt: '2026-10-27T10:00:00Z'
                items:
                  - id: 501
                    productId: 101
                    productName: iPhone 9
                    productSlug: iphone-9
                    thumbnailUrl: https://cdn.flashopify.local/products/101/thumbnail.webp
                    originalPrice: '549.00'
                    salePrice: '399.00'
                    totalStock: 100
                    remainingStock: 100
                    limitPerUser: 1
                    sold: 0
        '400':
          description: Field errors (`VALIDATION_ERROR`) or `INVALID_TIME_RANGE`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: VALIDATION_ERROR
                message: Dữ liệu không hợp lệ
                traceId: a1b2c3d4
                timestamp: '2026-10-27T10:00:00Z'
                fieldErrors:
                  - field: startTime
                    message: must be in the future
                  - field: items[0].totalStock
                    message: exceeds available stock (94)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/InsufficientStock'

  /admin/flash-sales/{campaignId}:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
    get:
      tags: [admin-flash-sales]
      operationId: adminGetFlashSale
      summary: Get a campaign with its items
      x-roles: [ADMIN]
      responses:
        '200':
          description: Campaign detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCampaignDetail'
              example:
                id: 7
                name: Black Friday 12h
                startTime: '2026-11-27T12:00:00Z'
                endTime: '2026-11-27T13:00:00Z'
                status: RUNNING
                itemCount: 1
                totalStock: 100
                createdBy: 1
                createdAt: '2026-10-27T10:00:00Z'
                items:
                  - id: 501
                    productId: 101
                    productName: iPhone 9
                    productSlug: iphone-9
                    thumbnailUrl: https://cdn.flashopify.local/products/101/thumbnail.webp
                    originalPrice: '549.00'
                    salePrice: '399.00'
                    totalStock: 100
                    remainingStock: 37
                    limitPerUser: 1
                    sold: 63
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [admin-flash-sales]
      operationId: adminUpdateFlashSale
      summary: Update a SCHEDULED campaign
      description: Only allowed before warm-up (more than 5 minutes before start); otherwise `CAMPAIGN_NOT_EDITABLE`.
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignUpsertRequest'
            example:
              name: Black Friday 12h (extended)
              startTime: '2026-11-27T12:00:00Z'
              endTime: '2026-11-27T14:00:00Z'
              items:
                - productId: 101
                  salePrice: '399.00'
                  totalStock: 90
                  limitPerUser: 1
      responses:
        '200':
          description: Updated campaign.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCampaignDetail'
              example:
                id: 7
                name: Black Friday 12h (extended)
                startTime: '2026-11-27T12:00:00Z'
                endTime: '2026-11-27T14:00:00Z'
                status: SCHEDULED
                itemCount: 1
                totalStock: 90
                createdBy: 1
                createdAt: '2026-10-27T10:00:00Z'
                items:
                  - id: 501
                    productId: 101
                    productName: iPhone 9
                    productSlug: iphone-9
                    thumbnailUrl: https://cdn.flashopify.local/products/101/thumbnail.webp
                    originalPrice: '549.00'
                    salePrice: '399.00'
                    totalStock: 90
                    remainingStock: 90
                    limitPerUser: 1
                    sold: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/CampaignNotEditable'

  /admin/flash-sales/{campaignId}/cancel:
    post:
      tags: [admin-flash-sales]
      operationId: adminCancelFlashSale
      summary: Cancel a SCHEDULED or RUNNING campaign
      description: Stops new purchases immediately and releases unsold reserved stock. Existing orders are kept.
      x-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Cancelled campaign.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCampaignSummary'
              example:
                id: 7
                name: Black Friday 12h
                startTime: '2026-11-27T12:00:00Z'
                endTime: '2026-11-27T13:00:00Z'
                status: CANCELLED
                itemCount: 1
                totalStock: 100
                createdBy: 1
                createdAt: '2026-10-27T10:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/CampaignNotEditable'

