                    thumbnailUrl: https://cdn.flashopify.local/products/101/thumbnail.webp
                    quantity: 1
                    unitPrice: '399.00'
                    lineTotal: '399.00'
                shipping:
                  name: Nguyen Van An
                  phone: '0901234567'
