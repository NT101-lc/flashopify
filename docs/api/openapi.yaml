        - $ref: '#/components/parameters/To'
        - name: granularity
          in: query
          schema:
            type: string
            enum: [HOUR, DAY, MONTH]
            default: DAY
          example: DAY
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/OrderType'
          example: FLASH
      responses:
        '200':
          description: Buckets in ascending order (UTC).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevenueSeries'
              example:
                granularity: DAY
                points:
                  - bucketStart: '2026-11-26T00:00:00Z'
                    revenue: '3120.00'
                    orders: 8
                  - bucketStart: '2026-11-27T00:00:00Z'
                    revenue: '39900.00'
                    orders: 100
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/stats/flash-sales/{campaignId}:
    get:
      tags: [admin-stats]
      operationId: adminGetFlashSaleStats
      summary: Stock and order stats of a campaign
      description: Compares Redis stock with MySQL orders to surface reconciliation drift.
      x-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Campaign stats.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignStats'
              example:
                campaignId: 7
                status: ENDED
                revenue: '39900.00'
                items:
                  - itemId: 501
                    productId: 101
                    productName: iPhone 9
                    totalStock: 100
                    redisRemaining: 0
                    pendingOrders: 0
                    paidOrders: 100
                    cancelledOrders: 0
                    expiredOrders: 0
                    revenue: '39900.00'
                    inSync: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from `/auth/login` or `/auth/refresh` (expires after 15 minutes).

  headers:
    IdempotentReplayed:
      description: '`true` when the response is a replay of an earlier request with the same Idempotency-Key.'
      schema:
        type: boolean
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated unique key (UUID recommended) per purchase attempt. Kept for 24 hours.
      schema:
        type: string
        minLength: 8
        maxLength: 64
      example: 7f3c2a10-5b1e-4c8d-9a2f-1e6b0d4c9e77
    Page:
      name: page
      in: query
      description: 0-based page index.
      schema:
        type: integer
        minimum: 0
        default: 0
      example: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20
    ProductSort:
      name: sort
      in: query
      description: '`field,direction`.'
      schema:
        type: string
        enum: ['createdAt,desc', 'price,asc', 'price,desc', 'rating,desc', 'name,asc']
        default: 'createdAt,desc'
      example: 'price,asc'
    AdminProductSort:
      name: sort
      in: query
      description: '`field,direction`.'
      schema:
        type: string
        enum: ['updatedAt,desc', 'createdAt,desc', 'name,asc', 'price,asc', 'price,desc', 'available,asc']
        default: 'updatedAt,desc'
      example: 'available,asc'
    OrderSort:
      name: sort
      in: query
      description: '`field,direction`.'
      schema:
        type: string
        enum: ['createdAt,desc', 'createdAt,asc', 'totalAmount,desc', 'totalAmount,asc']
        default: 'createdAt,desc'
      example: 'createdAt,desc'
    CampaignSort:
      name: sort
      in: query
      description: '`field,direction`.'
      schema:
        type: string
        enum: ['startTime,desc', 'startTime,asc', 'createdAt,desc']
        default: 'startTime,desc'
      example: 'startTime,desc'
    CustomerSort:
      name: sort
      in: query
      description: '`field,direction`.'
      schema:
        type: string
        enum: ['createdAt,desc', 'totalSpent,desc', 'orderCount,desc', 'fullName,asc']
        default: 'createdAt,desc'
      example: 'totalSpent,desc'
    From:
      name: from
      in: query
      description: Inclusive start (UTC).
      schema:
        type: string
        format: date-time
      example: '2026-11-01T00:00:00Z'
    To:
      name: to
      in: query
      description: Exclusive end (UTC).
      schema:
        type: string
        format: date-time
      example: '2026-12-01T00:00:00Z'
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: integer
        format: int64
      example: 101
    AddressId:
      name: addressId
      in: path
      required: true
      schema:
        type: integer
        format: int64
      example: 12
    OrderNo:
      name: orderNo
      in: path
      required: true
      description: '`OD` (normal) or `FS` (flash-sale) + 14 digits.'
      schema:
        $ref: '#/components/schemas/OrderNo'
      example: FS20261127000123
    FlashSaleItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: integer
        format: int64
      example: 501
    CampaignId:
      name: campaignId
      in: path
      required: true
      schema:
        type: integer
        format: int64
      example: 7

  responses:
    BadRequest:
      description: Invalid input (`VALIDATION_ERROR`, with `fieldErrors`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: VALIDATION_ERROR
            message: Dữ liệu không hợp lệ
            traceId: a1b2c3d4
            timestamp: '2026-10-27T08:00:00Z'
            fieldErrors:
              - field: email
                message: must be a well-formed email address
    Unauthorized:
      description: Missing, invalid or expired token (`UNAUTHORIZED`, `TOKEN_EXPIRED`, `INVALID_TOKEN`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: TOKEN_EXPIRED
            message: Phiên đăng nhập đã hết hạn
            traceId: a1b2c3d4
            timestamp: '2026-10-27T08:00:00Z'
    Forbidden:
      description: Authenticated but role not allowed (`FORBIDDEN`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: FORBIDDEN
            message: Bạn không có quyền thực hiện thao tác này
            traceId: a1b2c3d4
            timestamp: '2026-10-27T08:00:00Z'
    NotFound:
      description: Resource not found or not owned by the caller (`*_NOT_FOUND`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: ORDER_NOT_FOUND
            message: Không tìm thấy đơn hàng
            traceId: a1b2c3d4
            timestamp: '2026-10-27T08:00:00Z'
    Conflict:
      description: Request conflicts with current state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: PRODUCT_IN_ACTIVE_CAMPAIGN
            message: Sản phẩm đang nằm trong chiến dịch flash-sale
            traceId: a1b2c3d4
            timestamp: '2026-10-27T08:00:00Z'
    InsufficientStock:
      description: Not enough available stock (`INSUFFICIENT_STOCK`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: INSUFFICIENT_STOCK
            message: Sản phẩm chỉ còn 2
            traceId: a1b2c3d4
            timestamp: '2026-10-27T08:00:00Z'
    InvalidOrderState:
      description: Order status does not allow this action (`INVALID_ORDER_STATE`, `ORDER_EXPIRED`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: INVALID_ORDER_STATE
            message: Đơn hàng không ở trạng thái PENDING
            traceId: a1b2c3d4
            timestamp: '2026-10-27T08:00:00Z'
    CampaignNotEditable:
      description: Campaign is past warm-up, ended or cancelled (`CAMPAIGN_NOT_EDITABLE`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: CAMPAIGN_NOT_EDITABLE
            message: Chiến dịch đã warm-up, không thể sửa
            traceId: a1b2c3d4
            timestamp: '2026-10-27T08:00:00Z'
    ImageLimitExceeded:
      description: Product already has 8 gallery images (`IMAGE_LIMIT_EXCEEDED`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: IMAGE_LIMIT_EXCEEDED
            message: Mỗi sản phẩm tối đa 8 ảnh
            traceId: a1b2c3d4
            timestamp: '2026-10-27T08:00:00Z'
    TooManyRequests:
      description: Rate limit or quota exceeded (`RATE_LIMITED`, `AI_QUOTA_EXCEEDED`).
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: RATE_LIMITED
            message: Bạn thao tác quá nhanh, thử lại sau
            traceId: a1b2c3d4
            timestamp: '2026-10-27T08:00:00Z'

  schemas:
    # ---------- common ----------
    Money:
      type: string
      description: Decimal amount with exactly 2 fraction digits (DECIMAL(15,2)).
      pattern: '^\d{1,13}\.\d{2}$'
      examples: ['549.00']
    OrderNo:
      type: string
      pattern: '^(OD|FS)\d{14}$'
      examples: [FS20261127000123]
    ErrorCode:
      type: string
      description: Business error codes. The frontend maps them to toast messages.
      enum:
        # generic
        - VALIDATION_ERROR
        - MALFORMED_REQUEST
        - UNAUTHORIZED
        - INVALID_TOKEN
        - TOKEN_EXPIRED
        - FORBIDDEN
        - RATE_LIMITED
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE
        # idempotency
        - IDEMPOTENCY_KEY_MISSING
        - IDEMPOTENCY_KEY_CONFLICT
        - REQUEST_IN_PROGRESS
        # auth / user
        - INVALID_CREDENTIALS
        - ACCOUNT_LOCKED
        - EMAIL_ALREADY_EXISTS
        - USER_NOT_FOUND
        - ADDRESS_NOT_FOUND
        # catalog / inventory
        - PRODUCT_NOT_FOUND
        - PRODUCT_NOT_AVAILABLE
        - CATEGORY_NOT_FOUND
        - DUPLICATE_SKU
        - DUPLICATE_SLUG
        - INSUFFICIENT_STOCK
        - CONCURRENT_MODIFICATION
        - PRODUCT_IN_ACTIVE_CAMPAIGN
        # images
        - IMAGE_NOT_FOUND
        - IMAGE_LIMIT_EXCEEDED
        - UNSUPPORTED_MEDIA_TYPE
        - FILE_TOO_LARGE
        - OBJECT_NOT_FOUND
        # cart
        - CART_ITEM_NOT_FOUND
        - CART_EMPTY
        # flash-sale
        - CAMPAIGN_NOT_FOUND
        - FLASH_SALE_ITEM_NOT_FOUND
        - CAMPAIGN_NOT_ACTIVE
        - CAMPAIGN_NOT_EDITABLE
        - INVALID_TIME_RANGE
        - SOLD_OUT
        - LIMIT_EXCEEDED
        # orders / payments
        - ORDER_NOT_FOUND
        - INVALID_ORDER_STATE
        - ORDER_EXPIRED
        - PAYMENT_NOT_FOUND
        - INVALID_SIGNATURE
        - PAYMENT_AMOUNT_MISMATCH
        # ai
        - AI_QUOTA_EXCEEDED
        - AI_LOGIN_REQUIRED
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: Path of the invalid field, e.g. `items[0].quantity`.
        message:
          type: string
        rejectedValue:
          description: The rejected value (omitted for secrets).
    ErrorResponse:
      type: object
      required: [code, message, traceId, timestamp]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: Human-readable message (Vietnamese or English per Accept-Language).
        traceId:
          type: string
        timestamp:
          type: string
          format: date-time
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    PageResponse:
      type: object
      description: Generic page. Concrete `*Page` schemas narrow `items`.
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items: {}
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalItems:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0

    # ---------- auth / user ----------
    Role:
      type: string
      enum: [CUSTOMER, ADMIN]
    UserStatus:
      type: string
      enum: [ACTIVE, LOCKED, DELETED]
    RegisterRequest:
      type: object
      required: [email, password, fullName]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
        fullName:
          type: string
          minLength: 1
          maxLength: 100
        phone:
          type: string
          pattern: '^\+?\d{9,15}$'
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    TokenResponse:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn, user]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          description: Access token lifetime in seconds.
        user:
          $ref: '#/components/schemas/UserProfile'
    UserProfile:
      type: object
      required: [id, email, fullName, role, createdAt]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        fullName:
          type: string
        phone:
          type: [string, 'null']
        role:
          $ref: '#/components/schemas/Role'
        createdAt:
          type: string
          format: date-time
    UpdateProfileRequest:
      type: object
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 100
        phone:
          type: string
          pattern: '^\+?\d{9,15}$'
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 72
    DeleteAccountRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          format: password
    AddressRequest:
      type: object
      required: [receiverName, phone, addressLine, city]
      properties:
        receiverName:
          type: string
          maxLength: 100
        phone:
          type: string
          pattern: '^\+?\d{9,15}$'
        addressLine:
          type: string
          maxLength: 255
        ward:
          type: string
          maxLength: 100
        district:
          type: string
          maxLength: 100
        city:
          type: string
          maxLength: 100
        isDefault:
          type: boolean
          default: false
    Address:
      type: object
      required: [id, receiverName, phone, addressLine, city, isDefault, createdAt]
      properties:
        id:
          type: integer
          format: int64
        receiverName:
          type: string
        phone:
          type: string
        addressLine:
          type: string
        ward:
          type: [string, 'null']
        district:
          type: [string, 'null']
        city:
          type: string
        isDefault:
          type: boolean
        createdAt:
          type: string
          format: date-time

    # ---------- catalog ----------
    Category:
      type: object
      required: [id, slug, name, productCount, children]
      properties:
        id:
          type: integer
          format: int64
        slug:
          type: string
        name:
          type: string
        productCount:
          type: integer
        children:
          type: array
          items:
            $ref: '#/components/schemas/Category'
    CategoryRef:
      type: object
      required: [id, slug, name]
      properties:
        id:
          type: integer
          format: int64
        slug:
          type: string
        name:
          type: string
    ProductStatus:
      type: string
      enum: [ACTIVE, INACTIVE, DELETED]
    FlashSaleBadge:
      type: object
      description: Present when the product is in a RUNNING campaign.
      required: [itemId, salePrice, endTime]
      properties:
        itemId:
          type: integer
          format: int64
        salePrice:
          $ref: '#/components/schemas/Money'
        endTime:
          type: string
          format: date-time
    ProductSummary:
      type: object
      required: [id, name, slug, price, categorySlug, inStock]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        slug:
          type: string
        brand:
          type: [string, 'null']
        price:
          $ref: '#/components/schemas/Money'
        rating:
          type: [number, 'null']
          minimum: 0
          maximum: 5
        thumbnailUrl:
          type: [string, 'null']
          format: uri
        categorySlug:
          type: string
        inStock:
          type: boolean
        flashSale:
          oneOf:
            - $ref: '#/components/schemas/FlashSaleBadge'
            - type: 'null'
    ProductDetail:
      allOf:
        - $ref: '#/components/schemas/ProductSummary'
        - type: object
          required: [sku, category, availableQuantity, images]
          properties:
            sku:
              type: string
            description:
              type: [string, 'null']
            category:
              $ref: '#/components/schemas/CategoryRef'
            availableQuantity:
              type: integer
              minimum: 0
            images:
              type: array
              maxItems: 8
              items:
                $ref: '#/components/schemas/ProductImage'
    ProductImage:
      type: object
      required: [id, url, sortOrder]
      properties:
        id:
          type: integer
          format: int64
        url:
          type: string
          format: uri
        sortOrder:
          type: integer
          minimum: 0
    ProductPage:
      allOf:
        - $ref: '#/components/schemas/PageResponse'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ProductSummary'

    # ---------- cart ----------
    CartItem:
      type: object
      required: [productId, name, slug, unitPrice, quantity, lineTotal, availableQuantity, addedAt]
      properties:
        productId:
          type: integer
          format: int64
        name:
          type: string
        slug:
          type: string
        thumbnailUrl:
          type: [string, 'null']
          format: uri
        unitPrice:
          $ref: '#/components/schemas/Money'
        quantity:
          type: integer
          minimum: 1
        lineTotal:
          $ref: '#/components/schemas/Money'
        availableQuantity:
          type: integer
          minimum: 0
          description: Lets the UI warn when the cart exceeds current stock.
        addedAt:
          type: string
          format: date-time
    Cart:
      type: object
      required: [items, totalQuantity, subtotal]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        totalQuantity:
          type: integer
        subtotal:
          $ref: '#/components/schemas/Money'
        updatedAt:
          type: [string, 'null']
          format: date-time
    AddCartItemRequest:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: integer
          format: int64
        quantity:
          type: integer
          minimum: 1
          maximum: 99
    UpdateCartItemRequest:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 1
          maximum: 99

    # ---------- orders ----------
    OrderStatus:
      type: string
      description: '`PROCESSING` is transient: flash-sale purchase accepted but not yet persisted.'
      enum: [PROCESSING, PENDING, PAID, COMPLETED, CANCELLED, EXPIRED]
    OrderType:
      type: string
      enum: [NORMAL, FLASH]
    OrderLineRequest:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: integer
          format: int64
        quantity:
          type: integer
          minimum: 1
          maximum: 99
    CreateOrderRequest:
      type: object
      required: [addressId, items]
      properties:
        addressId:
          type: integer
          format: int64
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/OrderLineRequest'
        note:
          type: string
          maxLength: 255
    OrderItem:
      type: object
      required: [productId, productName, quantity, unitPrice, lineTotal]
      properties:
        productId:
          type: integer
          format: int64
        productName:
          type: string
        thumbnailUrl:
          type: [string, 'null']
          format: uri
        quantity:
          type: integer
          minimum: 1
        unitPrice:
          $ref: '#/components/schemas/Money'
        lineTotal:
          $ref: '#/components/schemas/Money'
    ShippingInfo:
      type: object
      description: Snapshot of the address at order time.
      required: [name, phone, address]
      properties:
        name:
          type: string
        phone:
          type: string
        address:
          type: string
    OrderSummary:
      type: object
      required: [orderNo, type, status, totalAmount, itemCount, createdAt]
      properties:
        orderNo:
          $ref: '#/components/schemas/OrderNo'
        type:
          $ref: '#/components/schemas/OrderType'
        status:
          $ref: '#/components/schemas/OrderStatus'
        totalAmount:
          $ref: '#/components/schemas/Money'
        itemCount:
          type: integer
        thumbnailUrl:
          type: [string, 'null']
          format: uri
        createdAt:
          type: string
          format: date-time
        expiredAt:
          type: [string, 'null']
          format: date-time
          description: Deadline for payment (15 minutes after creation).
        paidAt:
          type: [string, 'null']
          format: date-time
    OrderDetail:
      allOf:
        - $ref: '#/components/schemas/OrderSummary'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/OrderItem'
            shipping:
              oneOf:
                - $ref: '#/components/schemas/ShippingInfo'
                - type: 'null'
            flashSaleItemId:
              type: [integer, 'null']
              format: int64
    OrderPage:
      allOf:
        - $ref: '#/components/schemas/PageResponse'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/OrderSummary'

    # ---------- flash sales ----------
    FlashSaleCampaignStatus:
      type: string
      enum: [SCHEDULED, RUNNING, ENDED, CANCELLED]
    FlashSaleItem:
      type: object
      required: [id, productId, productName, productSlug, originalPrice, salePrice, totalStock, remainingStock, limitPerUser]
      properties:
        id:
          type: integer
          format: int64
          description: Flash-sale item id (`itemId` in paths).
        productId:
          type: integer
          format: int64
        productName:
          type: string
        productSlug:
          type: string
        thumbnailUrl:
          type: [string, 'null']
          format: uri
        originalPrice:
          $ref: '#/components/schemas/Money'
        salePrice:
          $ref: '#/components/schemas/Money'
        totalStock:
          type: integer
          minimum: 1
        remainingStock:
          type: integer
          minimum: 0
        limitPerUser:
          type: integer
          minimum: 1
    CampaignRef:
      type: object
      required: [id, name, startTime, endTime, status]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/FlashSaleCampaignStatus'
    FlashSaleCampaign:
      allOf:
        - $ref: '#/components/schemas/CampaignRef'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/FlashSaleItem'
    FlashSaleItemDetail:
      allOf:
        - $ref: '#/components/schemas/FlashSaleItem'
        - type: object
          required: [campaign, serverTime]
          properties:
            campaign:
              $ref: '#/components/schemas/CampaignRef'
            purchasedByMe:
              type: [integer, 'null']
              minimum: 0
              description: Units already bought by the caller; null for anonymous calls.
            serverTime:
              type: string
              format: date-time
              description: Lets the countdown correct for client clock skew.
    FlashSalePurchaseRequest:
      type: object
      required: [quantity, addressId]
      properties:
        quantity:
          type: integer
          minimum: 1
        addressId:
          type: integer
          format: int64
    FlashSalePurchaseResponse:
      type: object
      required: [orderNo, status]
      properties:
        orderNo:
          $ref: '#/components/schemas/OrderNo'
        status:
          type: string
          const: PROCESSING

    # ---------- payments ----------
    PaymentStatus:
      type: string
      enum: [INITIATED, SUCCESS, FAILED]
    Payment:
      type: object
      required: [id, orderNo, amount, status, createdAt]
      properties:
        id:
          type: integer
          format: int64
        orderNo:
          $ref: '#/components/schemas/OrderNo'
        amount:
          $ref: '#/components/schemas/Money'
        status:
          $ref: '#/components/schemas/PaymentStatus'
        paymentUrl:
          type: [string, 'null']
          format: uri
          description: Mock gateway page where the customer completes payment.
        expiresAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
    PaymentCallbackRequest:
      type: object
      required: [paymentId, orderNo, providerTxnId, amount, status, occurredAt]
      properties:
        paymentId:
          type: integer
          format: int64
        orderNo:
          $ref: '#/components/schemas/OrderNo'
        providerTxnId:
          type: string
          maxLength: 64
        amount:
          $ref: '#/components/schemas/Money'
        status:
          type: string
          enum: [SUCCESS, FAILED]
        failureReason:
          type: [string, 'null']
        occurredAt:
          type: string
          format: date-time
    PaymentCallbackAck:
      type: object
      required: [received, duplicate]
      properties:
        received:
          type: boolean
        duplicate:
          type: boolean
          description: True when this providerTxnId was already processed.

    # ---------- ai ----------
    AiChatRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 1000
        conversationId:
          type: string
          format: uuid
          description: Omit to start a new conversation.
    AiChatResponse:
      type: object
      required: [conversationId, reply, fallback]
      properties:
        conversationId:
          type: string
          format: uuid
        reply:
          type: string
        fallback:
          type: boolean
          description: True when the LLM was unavailable and a canned reply was returned.
        products:
          type: array
          description: Products referenced in the reply, for rendering cards.
          items:
            $ref: '#/components/schemas/ProductSummary'

    # ---------- admin: products ----------
    Inventory:
      type: object
      required: [quantity, reserved, available, version]
      properties:
        quantity:
          type: integer
          minimum: 0
        reserved:
          type: integer
          minimum: 0
        available:
          type: integer
          minimum: 0
          description: quantity - reserved.
        version:
          type: integer
          description: Optimistic-lock version.
    AdminProductSummary:
      type: object
      required: [id, sku, name, slug, price, status, categoryId, inventory, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        sku:
          type: string
        name:
          type: string
        slug:
          type: string
        brand:
          type: [string, 'null']
        price:
          $ref: '#/components/schemas/Money'
        status:
          $ref: '#/components/schemas/ProductStatus'
        thumbnailUrl:
          type: [string, 'null']
          format: uri
        categoryId:
          type: integer
          format: int64
        inventory:
          $ref: '#/components/schemas/Inventory'
        updatedAt:
          type: string
          format: date-time
    AdminProductDetail:
      allOf:
        - $ref: '#/components/schemas/AdminProductSummary'
        - type: object
          required: [images, createdAt]
          properties:
            description:
              type: [string, 'null']
            rating:
              type: [number, 'null']
            sourceId:
              type: [integer, 'null']
              description: DummyJSON id for seeded products.
            images:
              type: array
              items:
                $ref: '#/components/schemas/ProductImage'
            createdAt:
              type: string
              format: date-time
    AdminProductPage:
      allOf:
        - $ref: '#/components/schemas/PageResponse'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AdminProductSummary'
    ProductUpsertRequest:
      type: object
      required: [categoryId, sku, name, slug, price, status]
      properties:
        categoryId:
          type: integer
          format: int64
        sku:
          type: string
          maxLength: 50
        name:
          type: string
          maxLength: 255
        slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          maxLength: 255
          description: Unique. The value `brands` is reserved (public route `/products/brands`) and rejected with 400.
        description:
          type: string
          maxLength: 16000
        brand:
          type: string
          maxLength: 100
        price:
          $ref: '#/components/schemas/Money'
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
        initialStock:
          type: integer
          minimum: 0
          description: Only used on create.
    UpdateInventoryRequest:
      type: object
      required: [quantity, version]
      properties:
        quantity:
          type: integer
          minimum: 0
        version:
          type: integer
    ImageUploadUrlRequest:
      type: object
      required: [fileName, contentType, contentLength]
      properties:
        fileName:
          type: string
          maxLength: 255
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        contentLength:
          type: integer
          minimum: 1
          maximum: 5242880
    ImageUploadUrlResponse:
      type: object
      required: [uploadUrl, objectKey, method, headers, expiresAt]
      properties:
        uploadUrl:
          type: string
          format: uri
        objectKey:
          type: string
        method:
          type: string
          const: PUT
        headers:
          type: object
          description: Headers the client must send with the upload.
          additionalProperties:
            type: string
        expiresAt:
          type: string
          format: date-time
    AddProductImageRequest:
      type: object
      required: [objectKey]
      properties:
        objectKey:
          type: string
        sortOrder:
          type: integer
          minimum: 0
          description: Defaults to the end of the gallery.
        setAsThumbnail:
          type: boolean
          default: false
    ReorderImagesRequest:
      type: object
      required: [imageIds]
      properties:
        imageIds:
          type: array
          maxItems: 8
          uniqueItems: true
          items:
            type: integer
            format: int64

    # ---------- admin: flash sales ----------
    CampaignItemRequest:
      type: object
      required: [productId, salePrice, totalStock, limitPerUser]
      properties:
        productId:
          type: integer
          format: int64
        salePrice:
          $ref: '#/components/schemas/Money'
        totalStock:
          type: integer
          minimum: 1
        limitPerUser:
          type: integer
          minimum: 1
          default: 1
    CampaignUpsertRequest:
      type: object
      required: [name, startTime, endTime, items]
      properties:
        name:
          type: string
          maxLength: 255
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CampaignItemRequest'
    AdminCampaignSummary:
      allOf:
        - $ref: '#/components/schemas/CampaignRef'
        - type: object
          required: [itemCount, totalStock, createdBy, createdAt]
          properties:
            itemCount:
              type: integer
            totalStock:
              type: integer
            createdBy:
              type: integer
              format: int64
            createdAt:
              type: string
              format: date-time
    AdminCampaignItem:
      allOf:
        - $ref: '#/components/schemas/FlashSaleItem'
        - type: object
          required: [sold]
          properties:
            sold:
              type: integer
              minimum: 0
    AdminCampaignDetail:
      allOf:
        - $ref: '#/components/schemas/AdminCampaignSummary'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AdminCampaignItem'
    AdminCampaignPage:
      allOf:
        - $ref: '#/components/schemas/PageResponse'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AdminCampaignSummary'

    # ---------- admin: orders / customers ----------
    CustomerRef:
      type: object
      required: [id, email, fullName]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        fullName:
          type: string
    AdminOrderSummary:
      allOf:
        - $ref: '#/components/schemas/OrderSummary'
        - type: object
          required: [customer]
          properties:
            customer:
              $ref: '#/components/schemas/CustomerRef'
    AdminOrderDetail:
      allOf:
        - $ref: '#/components/schemas/OrderDetail'
        - type: object
          required: [customer, payments, updatedAt]
          properties:
            customer:
              $ref: '#/components/schemas/CustomerRef'
            payments:
              type: array
              items:
                $ref: '#/components/schemas/Payment'
            updatedAt:
              type: string
              format: date-time
    AdminOrderPage:
      allOf:
        - $ref: '#/components/schemas/PageResponse'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AdminOrderSummary'
    AdminCancelOrderRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 255
    AdminCustomer:
      type: object
      required: [id, email, fullName, status, orderCount, totalSpent, createdAt]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        fullName:
          type: string
        phone:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/UserStatus'
        orderCount:
          type: integer
        totalSpent:
          $ref: '#/components/schemas/Money'
        createdAt:
          type: string
          format: date-time
    AdminCustomerDetail:
      allOf:
        - $ref: '#/components/schemas/AdminCustomer'
        - type: object
          required: [addresses]
          properties:
            lockedUntil:
              type: [string, 'null']
              format: date-time
            addresses:
              type: array
              items:
                $ref: '#/components/schemas/Address'
    AdminCustomerPage:
      allOf:
        - $ref: '#/components/schemas/PageResponse'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AdminCustomer'

    # ---------- admin: stats ----------
    StatsOverview:
      type: object
      required: [from, to, revenue, paidOrders, pendingOrders, cancelledOrders, expiredOrders, newCustomers, averageOrderValue]
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        revenue:
          $ref: '#/components/schemas/Money'
        paidOrders:
          type: integer
        pendingOrders:
          type: integer
        cancelledOrders:
          type: integer
        expiredOrders:
          type: integer
        newCustomers:
          type: integer
        averageOrderValue:
          $ref: '#/components/schemas/Money'
    RevenuePoint:
      type: object
      required: [bucketStart, revenue, orders]
      properties:
        bucketStart:
          type: string
          format: date-time
        revenue:
          $ref: '#/components/schemas/Money'
        orders:
          type: integer
    RevenueSeries:
      type: object
      required: [granularity, points]
      properties:
        granularity:
          type: string
          enum: [HOUR, DAY, MONTH]
        points:
          type: array
          items:
            $ref: '#/components/schemas/RevenuePoint'
    CampaignItemStats:
      type: object
      required: [itemId, productId, productName, totalStock, redisRemaining, pendingOrders, paidOrders, cancelledOrders, expiredOrders, revenue, inSync]
      properties:
        itemId:
          type: integer
          format: int64
        productId:
          type: integer
          format: int64
        productName:
          type: string
        totalStock:
          type: integer
        redisRemaining:
          type: [integer, 'null']
          description: Null when the key is not in Redis (before warm-up or after cleanup).
        pendingOrders:
          type: integer
        paidOrders:
          type: integer
        cancelledOrders:
          type: integer
        expiredOrders:
          type: integer
        revenue:
          $ref: '#/components/schemas/Money'
        inSync:
          type: boolean
          description: totalStock == redisRemaining + pendingOrders + paidOrders.
    CampaignStats:
      type: object
      required: [campaignId, status, revenue, items]
      properties:
        campaignId:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/FlashSaleCampaignStatus'
        revenue:
          $ref: '#/components/schemas/Money'
        items:
          type: array
          items:
            $ref: '#/components/schemas/CampaignItemStats'
