        '409':
          $ref: '#/components/responses/InvalidOrderState'
    get:
      tags: [payments]
      operationId: getPayment
      summary: Get the latest payment of an order
      x-roles: [CUSTOMER]
      responses:
        '200':
          description: Latest payment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
              example:
                id: 3301
                orderNo: FS20261127000123
                amount: '399.00'
                status: SUCCESS
                paymentUrl: http://localhost:8080/mock-gateway/pay/3301
                expiresAt: '2026-11-27T12:15:01Z'
                createdAt: '2026-11-27T12:01:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /payments/callback:
    post:
      tags: [payments]
      operationId: handlePaymentCallback
      summary: Payment gateway webhook
      description: |
        Called by the (mock) payment gateway. Authenticated by `X-Signature`, not by JWT.
        Duplicate callbacks (same `providerTxnId`) return 200 without reprocessing.
        SUCCESS → order PAID; FAILED → order CANCELLED and stock released.
      x-roles: [PUBLIC]
      security: []
      parameters:
        - name: X-Signature
          in: header
          required: true
          description: Hex-encoded `HMAC-SHA256(rawRequestBody, sharedSecret)`.
          schema:
            type: string
            pattern: '^[a-f0-9]{64}$'
          example: 5d41402abc4b2a76b9719d911017c5925d41402abc4b2a76b9719d911017c592
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCallbackRequest'
            example:
              paymentId: 3301
              orderNo: FS20261127000123
              providerTxnId: MOCK-TXN-8f2a91
              amount: '399.00'
              status: SUCCESS
              occurredAt: '2026-11-27T12:03:10Z'
      responses:
        '200':
          description: Callback accepted (processed now or previously).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentCallbackAck'
              example:
                received: true
                duplicate: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Signature mismatch (`INVALID_SIGNATURE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: INVALID_SIGNATURE
                message: Chữ ký không hợp lệ
                traceId: a1b2c3d4
                timestamp: '2026-11-27T12:03:10Z'
        '404':
          $ref: '#/components/responses/NotFound'

