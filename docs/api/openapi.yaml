  /ai/chat:
    post:
      tags: [ai]
      operationId: chatWithAssistant
      summary: Ask the AI shopping assistant
      description: |
        RAG over product descriptions plus tools (searchProducts, getOrderStatus, getActiveFlashSales).
        Order questions require a token; tools always use the userId from the token.
        If the LLM fails or exceeds 10 s, a fallback reply is returned with `fallback: true`.
        Daily question quota per user/IP; exceeding it returns 429 `AI_QUOTA_EXCEEDED`.
      x-roles: [PUBLIC]
      security:
        - {}
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiChatRequest'
            example:
              message: Có điện thoại nào dưới 500 đô đang flash-sale không?
              conversationId: 4b8e2f0a-1c3d-4e5f-8a9b-0c1d2e3f4a5b
      responses:
        '200':
          description: Assistant reply.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiChatResponse'
              example:
                conversationId: 4b8e2f0a-1c3d-4e5f-8a9b-0c1d2e3f4a5b
                reply: iPhone 9 đang flash-sale giá 399.00 USD đến 13:00 UTC hôm nay.
                fallback: false
                products:
                  - id: 101
                    name: iPhone 9
                    slug: iphone-9
                    brand: Apple
                    price: '549.00'
                    rating: 4.69
                    thumbnailUrl: https://cdn.flashopify.local/products/101/thumbnail.webp
                    categorySlug: smartphones
                    inStock: true
                    flashSale:
                      itemId: 501
                      salePrice: '399.00'
                      endTime: '2026-11-27T13:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'

