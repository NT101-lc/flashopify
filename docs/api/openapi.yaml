  # ===================== FLASH SALES =====================
  /flash-sales:
    get:
      tags: [flash-sales]
      operationId: listFlashSales
      summary: List running and upcoming flash-sale campaigns with their items
      description: Remaining stock is read from Redis and may lag by a few seconds.
      x-roles: [PUBLIC]
      security: []
      parameters:
        - name: status
          in: query
          description: Defaults to RUNNING and SCHEDULED.
          schema:
            type: array
            items:
              type: string
              enum: [SCHEDULED, RUNNING]
          style: form
          explode: true
          example: [RUNNING]
      responses:
        '200':
          description: Campaigns ordered by start time.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FlashSaleCampaign'
              example:
                - id: 7
                  name: Black Friday 12h
                  startTime: '2026-11-27T12:00:00Z'
                  endTime: '2026-11-27T13:00:00Z'
                  status: RUNNING
                  items:
                    - id: 501
                      productId: 101
                      productName: iPhone 9
                      productSlug: iphone-9
                      thumbnailUrl: https://cdn.flashopify.local/products/101/thumbnail.webp
                      originalPrice: '549.00'
                      salePrice: '399.00'
                      totalStock: 100
                      remainingStock: 37
                      limitPerUser: 1
        '400':
          $ref: '#/components/responses/BadRequest'

  /flash-sales/{itemId}:
    get:
      tags: [flash-sales]
      operationId: getFlashSaleItem
      summary: Get a flash-sale item with its campaign window
      description: When called with a token, `purchasedByMe` shows how many units the caller already bought.
      x-roles: [PUBLIC]
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FlashSaleItemId'
      responses:
        '200':
          description: Flash-sale item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlashSaleItemDetail'
              example:
                id: 501
                productId: 101
                productName: iPhone 9
                productSlug: iphone-9
                thumbnailUrl: https://cdn.flashopify.local/products/101/thumbnail.webp
                originalPrice: '549.00'
                salePrice: '399.00'
                totalStock: 100
                remainingStock: 37
                limitPerUser: 1
                purchasedByMe: 0
                campaign:
                  id: 7
                  name: Black Friday 12h
                  startTime: '2026-11-27T12:00:00Z'
                  endTime: '2026-11-27T13:00:00Z'
                  status: RUNNING
                serverTime: '2026-11-27T12:20:00Z'
        '404':
          $ref: '#/components/responses/NotFound'

  /flash-sales/{itemId}/purchase:
    post:
      tags: [flash-sales]
      operationId: purchaseFlashSaleItem
      summary: Buy a flash-sale item
      description: |
        Atomic check-and-decrement in Redis (time window, per-user limit, stock), then the order
        is created asynchronously via Kafka. Poll `GET /orders/{orderNo}` until the status leaves
        PROCESSING. Rate-limited per user and IP.
      x-roles: [CUSTOMER]
      parameters:
        - $ref: '#/components/parameters/FlashSaleItemId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlashSalePurchaseRequest'
            example:
              quantity: 1
              addressId: 12
      responses:
        '202':
          description: Stock reserved; order is being created.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlashSalePurchaseResponse'
              example:
                orderNo: FS20261127000123
                status: PROCESSING
        '400':
          description: Validation error or campaign outside its time window (`CAMPAIGN_NOT_ACTIVE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: CAMPAIGN_NOT_ACTIVE
                message: Chiến dịch chưa mở bán
                traceId: a1b2c3d4
                timestamp: '2026-11-27T11:59:58Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`SOLD_OUT`, `LIMIT_EXCEEDED`, `IDEMPOTENCY_KEY_CONFLICT` or `REQUEST_IN_PROGRESS`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                soldOut:
                  value:
                    code: SOLD_OUT
                    message: Sản phẩm đã hết
                    traceId: a1b2c3d4
                    timestamp: '2026-11-27T12:00:01Z'
                limitExceeded:
                  value:
                    code: LIMIT_EXCEEDED
                    message: Bạn đã mua tối đa 1 sản phẩm
                    traceId: b2c3d4e5
                    timestamp: '2026-11-27T12:00:01Z'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  # ===================== PAYMENTS =====================
  /payments/{orderNo}:
    parameters:
      - $ref: '#/components/parameters/OrderNo'
    post:
      tags: [payments]
      operationId: createPayment
      summary: Start a payment session for a PENDING order
