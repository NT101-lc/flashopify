      x-roles: [CUSTOMER]
      responses:
        '200':
          description: Existing payment session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
              example:
                id: 3301
                orderNo: FS20261127000123
                amount: '399.00'
                status: INITIATED
                paymentUrl: http://localhost:8080/mock-gateway/pay/3301
                expiresAt: '2026-11-27T12:15:01Z'
                createdAt: '2026-11-27T12:01:00Z'
        '201':
          description: Payment session created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
              example:
                id: 3301
                orderNo: FS20261127000123
                amount: '399.00'
                status: INITIATED
                paymentUrl: http://localhost:8080/mock-gateway/pay/3301
                expiresAt: '2026-11-27T12:15:01Z'
                createdAt: '2026-11-27T12:01:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
